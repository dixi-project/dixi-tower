# Integración continua: prueba de humo en Ubuntu y macOS, desde el repositorio y
# contra el wheel instalado, y prueba en Debian con Docker (tests/linux.sh).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  humo:
    name: Prueba de humo (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Instalar tmux
        run: |
          if [ "$RUNNER_OS" = macOS ]; then brew install tmux; else sudo apt-get update -qq && sudo apt-get install -y -qq tmux; fi
          tmux -V
      - name: Identidad de git para los repositorios de prueba
        run: |
          git config --global user.name "Dixi Tower CI"
          git config --global user.email "ci@example.com"
          git config --global init.defaultBranch main
      - uses: astral-sh/setup-uv@v10.4.0   # setup-uv ya no publica etiquetas móviles (v10): hay que fijar la versión
      - name: Prueba de humo desde el repositorio
        run: tests/smoke.sh
      - name: Construir el paquete
        run: uv build
      - name: Prueba de humo contra el wheel instalado
        run: tests/wheel.sh

  servicio:
    name: Servicio con systemd (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Instalar tmux y preparar systemd de usuario
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq tmux
          git config --global user.name "Dixi Tower CI"
          git config --global user.email "ci@example.com"
          sudo loginctl enable-linger "$USER"
          for i in $(seq 1 20); do [ -S "/run/user/$(id -u)/bus" ] && break; sleep 0.5; done
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "$GITHUB_ENV"
      - name: tests/servicio.sh
        run: timeout -k 10 300 tests/servicio.sh
      - name: Registro del panel y del servicio
        if: always()
        run: |
          systemctl --user status dixi-tower.service --no-pager || true
          journalctl --user -u dixi-tower.service --no-pager -n 50 || true

  linux:
    name: Debian 12 con Docker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: tests/linux.sh
        run: tests/linux.sh
