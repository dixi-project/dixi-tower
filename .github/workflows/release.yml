# Publicación en PyPI con Trusted Publishing (OIDC): sin tokens en secretos.
#
# Al empujar una etiqueta v* (por ejemplo v0.1.0): comprueba que coincide con la
# versión del paquete, construye, corre la prueba de humo contra el wheel, publica
# en TestPyPI y, tras la aprobación del environment «pypi», en PyPI.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  construir:
    name: Construir y probar
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: La etiqueta coincide con la versión del paquete
        run: |
          version="$(python3 -c 'import sys; sys.path.insert(0, "src"); import dixi_tower; print(dixi_tower.__version__)')"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::La etiqueta $GITHUB_REF_NAME no coincide con la versión del paquete ($version)."
            exit 1
          fi
          echo "Versión $version"
      - name: Instalar tmux
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tmux
      - name: Identidad de git para los repositorios de prueba
        run: |
          git config --global user.name "Dixi Tower CI"
          git config --global user.email "ci@example.com"
          git config --global init.defaultBranch main
      - uses: astral-sh/setup-uv@v10.4.0   # setup-uv ya no publica etiquetas móviles (v10): hay que fijar la versión
      - name: Construir el paquete
        run: uv build
      - name: Prueba de humo contra el wheel instalado
        run: tests/wheel.sh
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  testpypi:
    name: Publicar en TestPyPI
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/dixi-tower/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true   # permite relanzar el flujo si PyPI falló después de subir a TestPyPI

  pypi:
    name: Publicar en PyPI
    needs: testpypi
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/dixi-tower/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
